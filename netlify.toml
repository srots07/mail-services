[build]
  command = "prisma generate && next build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22.12.0"
  NPM_FLAGS = "--no-audit"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**, .next/cache/**, **/.next/**"
  SECRETS_SCAN_OMIT_KEYS = "SESSION_SECRET, TOKEN_ENCRYPTION_KEY"



