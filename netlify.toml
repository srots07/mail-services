[build]
  command = "node scripts/build-netlify.mjs"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["node_modules/.prisma/**/*", "prisma/**/*", "lib/generated/prisma/**/*"]

[build.environment]
  NODE_VERSION = "22.12.0"
  NPM_FLAGS = "--no-audit"
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**, .next/cache/**, **/.next/**, .netlify/**"
  SECRETS_SCAN_OMIT_KEYS = "SESSION_SECRET, TOKEN_ENCRYPTION_KEY, DATABASE_URL"
  APP_URL = "https://srots-mail.netlify.app"
  # DATABASE_URL must be set in Netlify UI: Site Settings → Environment Variables
  # Do NOT put credentials in this file — it is committed to git.
